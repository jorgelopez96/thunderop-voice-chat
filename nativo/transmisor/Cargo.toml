[package]
name = "transmisor"
version = "0.1.0"
edition = "2021"

[dependencies]
livekit = { version = "0.9.7", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.9.1", default-features = false, features = ["access-token"] }
livekit-capture = "0.1.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
base64 = "0.22"
windows = { version = "0.62", features = [
    "Foundation",
    "Wdk_Graphics_Direct3D",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# copia de livekit 0.9.7 con set_publisher_start_bitrate (el SDK no expone la conexión del publicador)
[patch.crates-io]
livekit = { path = "vendor/livekit" }
